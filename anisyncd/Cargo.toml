[package]
name = "anisyncd"
version = "0.1.0"
edition = "2024"

[dependencies]
anisync-lib.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.0", features = ["json"] }
wincode = "0.6.1"
