[package]
name = "anisync-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anisync-lib.workspace = true
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
dirs = "6.0.0"
oauth2 = { version = "5.0.0", features = ["ureq", "pkce-plain"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tiny_http = "0.12.0"
toml = "1.1.4"
ureq = "3.4.0"
url = "2.5.8"
